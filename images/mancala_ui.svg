<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2744"/>
      <stop offset="100%" stop-color="#0a1e36"/>
    </linearGradient>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#0d6830"/>
    </linearGradient>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="storeP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#065f2e"/>
    </linearGradient>
    <linearGradient id="storeP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <filter id="pitGlow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle dot grid background -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dots)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="800" height="3" fill="#7c3aed"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="52" fill="rgba(0,0,0,0.35)"/>
  <text x="400" y="33" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">🎮  MANCALA SOLVER</text>

  <!-- Controls row -->
  <rect x="25" y="62" width="195" height="28" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(124,58,237,0.5)" stroke-width="1"/>
  <text x="35" y="80" fill="#9ca3af" font-family="Arial, sans-serif" font-size="10.5">Algorithm: Alpha-Beta ▾</text>

  <text x="240" y="72" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Depth</text>
  <rect x="278" y="67" width="110" height="5" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="278" y="67" width="55" height="5" rx="3" fill="#7c3aed"/>
  <circle cx="333" cy="69" r="7" fill="#a78bfa" stroke="#fff" stroke-width="1.5"/>
  <text x="298" y="85" fill="#9ca3af" font-family="Arial, sans-serif" font-size="10">4</text>

  <rect x="620" y="62" width="85" height="28" rx="6" fill="#7c3aed"/>
  <text x="662" y="80" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="700">New Game</text>

  <text x="440" y="80" fill="#a78bfa" font-family="Arial, sans-serif" font-size="12" font-weight="700">● Player 1's Turn</text>

  <!-- Main board -->
  <rect x="18" y="100" width="588" height="268" rx="14" fill="url(#boardGrad)" stroke="rgba(124,58,237,0.25)" stroke-width="1.5" filter="url(#pitGlow)"/>

  <!-- P2 Store (left) -->
  <rect x="32" y="115" width="68" height="238" rx="10" fill="url(#storeP2)" stroke="rgba(167,139,250,0.6)" stroke-width="1.5"/>
  <text x="66" y="230" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700">0</text>
  <text x="66" y="248" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="1">P2 STORE</text>

  <!-- P1 Store (right) -->
  <rect x="506" y="115" width="68" height="238" rx="10" fill="url(#storeP1)" stroke="rgba(74,222,128,0.5)" stroke-width="1.5"/>
  <text x="540" y="230" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700">0</text>
  <text x="540" y="248" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="1">P1 STORE</text>

  <!-- P2 pits top row (6 pits, left to right = pit 6,5,4,3,2,1) -->
  <g filter="url(#pitGlow)">
    <circle cx="118" cy="160" r="28" fill="url(#p2Grad)" stroke="rgba(167,139,250,0.7)" stroke-width="1.5"/>
    <text x="118" y="165" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
    <circle cx="187" cy="160" r="28" fill="url(#p2Grad)" stroke="rgba(167,139,250,0.7)" stroke-width="1.5"/>
    <text x="187" y="165" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
    <circle cx="256" cy="160" r="28" fill="url(#p2Grad)" stroke="rgba(167,139,250,0.7)" stroke-width="1.5"/>
    <text x="256" y="165" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
    <circle cx="325" cy="160" r="28" fill="url(#p2Grad)" stroke="rgba(167,139,250,0.7)" stroke-width="1.5"/>
    <text x="325" y="165" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
    <circle cx="394" cy="160" r="28" fill="url(#p2Grad)" stroke="rgba(167,139,250,0.7)" stroke-width="1.5"/>
    <text x="394" y="165" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
    <circle cx="463" cy="160" r="28" fill="url(#p2Grad)" stroke="rgba(167,139,250,0.7)" stroke-width="1.5"/>
    <text x="463" y="165" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
  </g>

  <!-- P2 label -->
  <text x="290" y="202" text-anchor="middle" fill="#a78bfa" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">AI  (PLAYER 2)</text>

  <!-- Center divider -->
  <line x1="108" y1="212" x2="472" y2="212" stroke="rgba(255,255,255,0.07)" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- P1 label -->
  <text x="290" y="228" text-anchor="middle" fill="#4ade80" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">PLAYER 1  (YOU)</text>

  <!-- P1 pits bottom row (pit 1,2,3,4,5,6) -->
  <g filter="url(#pitGlow)">
    <circle cx="118" cy="305" r="28" fill="url(#p1Grad)" stroke="rgba(74,222,128,0.6)" stroke-width="1.5"/>
    <text x="118" y="310" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
    <circle cx="187" cy="305" r="28" fill="url(#p1Grad)" stroke="rgba(74,222,128,0.6)" stroke-width="1.5"/>
    <text x="187" y="310" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
    <circle cx="256" cy="305" r="28" fill="url(#p1Grad)" stroke="rgba(74,222,128,0.6)" stroke-width="1.5"/>
    <text x="256" y="310" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
    <circle cx="325" cy="305" r="28" fill="url(#p1Grad)" stroke="rgba(74,222,128,0.6)" stroke-width="1.5"/>
    <text x="325" y="310" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
    <circle cx="394" cy="305" r="28" fill="url(#p1Grad)" stroke="rgba(74,222,128,0.6)" stroke-width="1.5"/>
    <text x="394" y="310" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
    <circle cx="463" cy="305" r="28" fill="url(#p1Grad)" stroke="rgba(74,222,128,0.6)" stroke-width="1.5"/>
    <text x="463" y="310" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
  </g>

  <!-- Move log panel -->
  <rect x="616" y="100" width="168" height="268" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="700" y="120" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">MOVE LOG</text>
  <line x1="628" y1="128" x2="772" y2="128" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <rect x="628" y="136" width="144" height="21" rx="4" fill="rgba(74,222,128,0.1)"/>
  <text x="636" y="150" fill="#4ade80" font-family="Arial, sans-serif" font-size="9">P1 played pit 3  +1 store</text>

  <rect x="628" y="162" width="144" height="21" rx="4" fill="rgba(167,139,250,0.1)"/>
  <text x="636" y="176" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="9">AI played pit 5  +0 store</text>

  <rect x="628" y="188" width="144" height="21" rx="4" fill="rgba(74,222,128,0.1)"/>
  <text x="636" y="202" fill="#4ade80" font-family="Arial, sans-serif" font-size="9">P1 played pit 1</text>

  <text x="700" y="290" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="9">— game started —</text>

  <!-- Score bar -->
  <rect x="18" y="378" width="588" height="44" rx="10" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="175" y="405" text-anchor="middle" fill="#4ade80" font-family="Arial, sans-serif" font-size="14" font-weight="700">P1: 0</text>
  <text x="400" y="405" text-anchor="middle" fill="#9ca3af" font-family="Arial, sans-serif" font-size="12">Score</text>
  <text x="430" y="395" text-anchor="middle" fill="#9ca3af" font-family="Arial, sans-serif" font-size="10">●●●●●●●●○○</text>
  <text x="620" y="405" text-anchor="middle" fill="#a78bfa" font-family="Arial, sans-serif" font-size="14" font-weight="700">AI: 0</text>

  <!-- Bottom score panel for right -->
  <rect x="616" y="378" width="168" height="44" rx="10" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="700" y="405" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Depth: 4 · Alpha-Beta</text>
</svg>
